{% extends "base.html" %}
{% block title %}Account — DocuMind AI{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Account</h1>
<div class="card" style="max-width: 560px;">
    <div class="card-body">
        <dl class="row mb-0">
            <dt class="col-sm-4">Username</dt>
            <dd class="col-sm-8">{{ user.username }}</dd>
            <dt class="col-sm-4">Email</dt>
            <dd class="col-sm-8">{{ user.email|default:"—" }}</dd>
            <dt class="col-sm-4">Workspace</dt>
            <dd class="col-sm-8">{{ user.workspace.name }}</dd>
            <dt class="col-sm-4">Joined</dt>
            <dd class="col-sm-8">{{ user.date_joined|date:"F j, Y" }}</dd>
        </dl>
    </div>
    <div class="card-footer">
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>
</div>
{% endblock %}
