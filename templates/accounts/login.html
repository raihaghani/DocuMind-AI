{% extends "base.html" %}
{% block title %}Login — DocuMind AI{% endblock %}

{% block public_content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card auth-card">
            <div class="card-body p-4">
                <h1 class="h4 mb-3 text-center">Welcome back</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">
                            Username
                        </label>
                        <input type="text" name="username" id="{{ form.username.id_for_label }}"
                               class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">
                            Password
                        </label>
                        <input type="password" name="password" id="{{ form.password.id_for_label }}"
                               class="form-control" required>
                    </div>
                    {% for error in form.non_field_errors %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endfor %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
                <p class="text-center text-muted mt-3 mb-0">
                    New here? <a href="{% url 'accounts:register' %}">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
